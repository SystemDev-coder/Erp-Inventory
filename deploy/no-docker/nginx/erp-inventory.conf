upstream erp_inventory_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SERVER_IP_OR_DOMAIN;

    root /srv/pms-bench/frontend/dist;
    index index.html;

    access_log /srv/pms-bench/logs/nginx-access.log;
    error_log /srv/pms-bench/logs/nginx-error.log warn;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://erp_inventory_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        alias /srv/pms-bench/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /ready {
        proxy_pass http://erp_inventory_api/api/health;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

