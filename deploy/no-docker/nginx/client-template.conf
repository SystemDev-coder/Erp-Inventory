upstream erp___NAME___api {
    server 127.0.0.1:__PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Each client has its OWN checkout/build (see new-client.sh) so one
    # client's code (custom reports, features, etc.) can never leak into
    # another client's site - only this client's own dist folder is served.
    root /srv/pms-bench/clients/__NAME__/frontend/dist;
    index index.html;

    access_log /srv/pms-bench/logs/__NAME__-access.log;
    error_log /srv/pms-bench/logs/__NAME__-error.log warn;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://erp___NAME___api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Each client's uploaded files (logos, attachments) live under their own
    # checkout too - never shared with other clients.
    location /uploads/ {
        alias /srv/pms-bench/clients/__NAME__/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /ready {
        proxy_pass http://erp___NAME___api/api/health;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
